<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salon AI OS</title>
<style>
  /* ============ tokens ============ */
  :root{
    --paper:#FCFBF9;        /* 温白 */
    --surface:#F5F2EE;      /* グレージュ面 */
    --card:#FFFFFF;
    --line:#E8E3DC;
    --ink:#37322E;          /* 墨 */
    --muted:#8B8378;
    --accent:#A18072;       /* サロン設定で上書きされます */
    --accent-deep:#82655A;
    --accent-soft:#F0E7E1;
    --sage:#8FA08A;
    --sage-soft:#EDF1EA;
    --gold:#C2A36B;
    --gold-soft:#F5EEDF;
    --rose:#C08A80;
    --rose-soft:#F6E9E6;
    --radius:18px;
    --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",-apple-system,sans-serif;
    color-scheme: light; /* 白基調・くすみカラーの世界観に固定 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--surface);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ============ 共通部品 ============ */
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-deep);font-weight:600}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 22px;border-radius:999px;font-weight:600;font-size:14px;
    background:var(--ink);color:#fff;transition:opacity .15s;
  }
  .btn:active{opacity:.75}
  .btn.accent{background:var(--accent-deep)}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.wide{width:100%}
  .chip{
    display:inline-block;padding:8px 14px;border-radius:999px;font-size:13px;
    background:var(--card);border:1px solid var(--line);color:var(--ink);
  }
  .chip:active{background:var(--accent-soft)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;letter-spacing:.04em}
  .pill.sage{background:var(--sage-soft);color:#5C7057}
  .pill.gold{background:var(--gold-soft);color:#8A713F}
  .pill.rose{background:var(--rose-soft);color:#96594E}
  .pill.plain{background:var(--surface);color:var(--muted)}
  .num{font-variant-numeric:tabular-nums}

  /* ============ アプリ枠（スマホフレーム） ============ */
  .wrap{min-height:100vh}
  @media(min-width:768px){
    .wrap{display:flex;align-items:flex-start;justify-content:center;padding:40px 20px}
    .phone{
      width:400px;height:820px;border-radius:44px;border:1px solid var(--line);
      background:var(--paper);overflow:hidden;position:relative;
      box-shadow:0 30px 80px rgba(55,50,46,.14);
    }
  }
  .phone{background:var(--paper);position:relative;min-height:100vh}
  @media(min-width:768px){.phone{min-height:0}}
  .screens{position:absolute;inset:0;overflow-y:auto;padding-bottom:96px}
  @media(max-width:767px){.screens{position:static;min-height:100vh}}
  .screen{display:none;padding:0 20px 24px;animation:fade .22s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .topbar{
    position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
    padding:16px 0 12px;background:var(--paper);
  }
  .topbar .back{width:34px;height:34px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px}
  .topbar .t{font-weight:600;font-size:15px}

  /* 下部タブ */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;z-index:10;
    display:flex;background:rgba(252,251,249,.94);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom));
  }
  @media(max-width:767px){.tabbar{position:fixed}}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:4px 0}
  .tabbar button .ic{font-size:19px;line-height:1}
  .tabbar button.on{color:var(--accent-deep);font-weight:600}

  /* ============ 画面部品 ============ */
  .c-hero{padding:30px 0 8px}
  .c-hero .eyebrow{display:block;margin-bottom:10px}
  .c-hero h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:.03em;margin:0 0 4px}
  .c-hero h1 small{font-size:13px;color:var(--muted);letter-spacing:.12em;font-family:var(--sans)}
  .c-hero .tag{color:var(--muted);font-size:13px;margin:0 0 20px}
  .hero-visual{
    height:150px;border-radius:22px;margin-bottom:20px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#E9DDD4,#D9C6BB 55%,#C9B2A6);
  }
  .hero-visual::after{
    content:"";position:absolute;width:180px;height:180px;border-radius:50%;
    right:-40px;top:-60px;background:rgba(255,255,255,.35);
  }
  .hero-visual .in{position:absolute;left:18px;bottom:14px;color:#fff;font-family:var(--serif);font-size:14px;letter-spacing:.12em;text-shadow:0 1px 8px rgba(0,0,0,.15)}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
  .quick-grid .q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left}
  .quick-grid .q .ic{font-size:22px;display:block;margin-bottom:8px}
  .quick-grid .q b{font-size:14px;display:block}
  .quick-grid .q span{font-size:11.5px;color:var(--muted)}
  .ai-banner{
    display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px;
    background:linear-gradient(120deg,var(--accent-soft),#F7F1EC);border:1px solid #E5D6CC;
    width:100%;text-align:left;margin-bottom:14px;
  }
  .ai-banner .face{width:44px;height:44px;border-radius:50%;background:var(--accent-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .ai-banner b{display:block;font-size:14px}
  .ai-banner span{font-size:12px;color:var(--muted)}
  .sec-h{font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:.06em;margin:26px 0 12px}

  .menu-item{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
  .menu-item:last-child{border-bottom:none}
  .menu-item b{font-size:14.5px;font-weight:600;display:block}
  .menu-item .d{font-size:12px;color:var(--muted)}
  .menu-item .p{font-weight:600;white-space:nowrap}
  .menu-item .p small{color:var(--muted);font-weight:400}

  /* チャット */
  .chat-log{display:flex;flex-direction:column;gap:12px;padding:8px 0 12px;min-height:200px}
  .msg{max-width:82%;padding:11px 15px;border-radius:18px;font-size:14px;line-height:1.7;white-space:pre-line}
  .msg.ai{background:var(--surface);border-bottom-left-radius:6px;align-self:flex-start}
  .msg.me{background:var(--accent-deep);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
  .msg.ai .cta{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .typing{align-self:flex-start;color:var(--muted);font-size:12px;padding:4px 6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 14px}
  .chat-note{font-size:11px;color:var(--muted);text-align:center;padding:6px 0 0}
  #chat-form{display:flex;gap:8px;padding:2px 0 10px}
  #chat-form[hidden]{display:none}

  /* カウンセラー */
  .step-dots{display:flex;gap:6px;margin:6px 0 18px}
  .step-dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
  .step-dots i.on{background:var(--accent-deep)}
  .opt-list{display:flex;flex-direction:column;gap:10px}
  .opt-list button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;text-align:left;font-size:14.5px;display:flex;align-items:center;gap:12px}
  .opt-list button:active{border-color:var(--accent);background:var(--accent-soft)}
  .opt-list .ic{font-size:19px}
  .counsel-q{font-family:var(--serif);font-size:19px;font-weight:500;margin:4px 0 16px;text-wrap:balance}
  .result-block{margin-bottom:14px}
  .result-block .lbl{font-size:11px;letter-spacing:.16em;color:var(--accent-deep);font-weight:600;margin-bottom:6px}
  .disclaimer{font-size:11.5px;color:var(--muted);background:var(--surface);border-radius:12px;padding:12px 14px;margin:16px 0}

  /* トースト */
  #toast{
    position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(16px);
    background:var(--ink);color:#fff;font-size:13px;padding:11px 20px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap;max-width:92vw;
  }
  #toast.show{opacity:1;transform:translateX(-50%)}
</style>

<!-- ================= お客様ページ ================= -->
<div class="wrap">
  <div class="phone">
    <div class="screens" id="c-screens">

      <!-- ホーム -->
      <section class="screen active" id="c-home">
        <div class="c-hero">
          <span class="eyebrow" id="c-eyebrow"></span>
          <h1 id="c-name"></h1>
          <p class="tag" id="c-tag"></p>
        </div>
        <div class="hero-visual"><span class="in" id="c-heroline"></span></div>
        <button class="ai-banner" onclick="goC('c-counsel');resetCounsel()">
          <span class="face">🌸</span>
          <span><b>AI美容カウンセラーに相談する</b><span>3つの質問で、あなたに合うケアをご提案（無料・24時間）</span></span>
        </button>
        <div class="quick-grid">
          <button class="q" onclick="goC('c-chat')"><span class="ic">🛎</span><b>AI受付に質問</b><span>営業時間・料金・駐車場など</span></button>
          <button class="q" onclick="goC('c-reserve')"><span class="ic">📅</span><b>予約する</b><span>LINE・Web・お電話</span></button>
          <button class="q" onclick="goC('c-menu')"><span class="ic">✨</span><b>メニュー</b><span>料金のご案内</span></button>
          <button class="q" onclick="goC('c-access')"><span class="ic">📍</span><b>アクセス</b><span>営業時間・場所</span></button>
        </div>
        <h2 class="sec-h">ただいまのご案内</h2>
        <div id="home-cards"></div>
      </section>

      <!-- メニュー -->
      <section class="screen" id="c-menu">
        <div class="topbar"><button class="back" onclick="goC('c-home')">←</button><span class="t">メニュー・料金</span></div>
        <div id="menu-body"></div>
        <button class="btn wide" onclick="goC('c-reserve')">このメニューで予約に進む</button>
      </section>

      <!-- AI受付チャット -->
      <section class="screen" id="c-chat">
        <div class="topbar"><button class="back" onclick="goC('c-home')">←</button>
          <span class="t">AI受付　<span class="pill sage">24時間対応</span></span></div>
        <div class="chat-log" id="chat-log"></div>
        <div class="chips" id="chat-chips"></div>
        <form id="chat-form" hidden>
          <input id="chat-input" placeholder="メッセージを入力…" autocomplete="off"
            style="flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:var(--card);font-size:14px">
          <button class="btn accent" type="submit" style="flex:none">送信</button>
        </form>
        <p class="chat-note" id="chat-note">AI受付はサロンの登録情報（ナレッジ）に基づいてお答えします。</p>
      </section>

      <!-- AIカウンセラー -->
      <section class="screen" id="c-counsel">
        <div class="topbar"><button class="back" onclick="goC('c-home')">←</button><span class="t">AI美容カウンセラー</span></div>
        <div id="counsel-body"></div>
      </section>

      <!-- アクセス -->
      <section class="screen" id="c-access">
        <div class="topbar"><button class="back" onclick="goC('c-home')">←</button><span class="t">アクセス・営業時間</span></div>
        <div class="hero-visual" style="height:120px;background:linear-gradient(135deg,#DDD6CC,#CFC5B8)"><span class="in" id="access-map-label"></span></div>
        <div class="card" style="margin-bottom:12px" id="access-rows"></div>
        <div class="card" id="access-cancel"></div>
      </section>

      <!-- 予約導線 -->
      <section class="screen" id="c-reserve">
        <div class="topbar"><button class="back" onclick="goC('c-home')">←</button><span class="t">ご予約</span></div>
        <p style="font-size:13.5px;color:var(--muted);margin:8px 2px 16px" id="reserve-intro"></p>
        <div class="opt-list">
          <button onclick="goLine()"><span class="ic">💬</span><span><b>LINEで予約する</b>　<span class="pill sage">おすすめ</span><br><span style="font-size:12px;color:var(--muted)" id="reserve-line-note"></span></span></button>
          <button onclick="toast('Web予約フォームは準備中です。LINEをご利用ください')"><span class="ic">🗓</span><span><b>Webフォームで予約する</b><br><span style="font-size:12px;color:var(--muted)" id="reserve-web-note"></span></span></button>
          <button onclick="goTel()"><span class="ic">📞</span><span><b>電話で予約する</b>　<span class="num" style="font-size:13px" id="reserve-tel"></span><br><span style="font-size:12px;color:var(--muted)" id="reserve-tel-note"></span></span></button>
        </div>
        <div class="disclaimer" id="reserve-disclaimer"></div>
      </section>
    </div>

    <nav class="tabbar" id="c-tab">
      <button data-s="c-home" class="on"><span class="ic">🏠</span>ホーム</button>
      <button data-s="c-menu"><span class="ic">✨</span>メニュー</button>
      <button data-s="c-counsel"><span class="ic">🌸</span>AI相談</button>
      <button data-s="c-chat"><span class="ic">🛎</span>受付</button>
      <button data-s="c-reserve"><span class="ic">📅</span>予約</button>
    </nav>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="salon-config.js"></script>
<script>
/* =========================================================
   Salon AI OS — お客様ページ（全サロン共通エンジン）
   サロン固有の情報はすべて salon-config.js（SALON_CONFIG）から
   読み込みます。このファイルにサロン名や価格を書かないこと。
   オーナー用の管理画面は admin.html（このページからは繋がない）。
   ========================================================= */
let C = window.SALON_CONFIG;

/* ---- マルチテナント：?s=サロンID ----
   指定があればWorkerからそのサロンの設定を取得して着せ替える。
   無指定なら従来どおり同梱の salon-config.js（chainonjoli）で動く */
const TENANT = ((new URLSearchParams(location.search)).get('s') || '').toLowerCase();

/* ============ 設定の流し込み ============ */
function hydrate(){
  const r = document.documentElement.style;
  r.setProperty('--accent', C.theme.accent);
  r.setProperty('--accent-deep', C.theme.accentDeep);
  r.setProperty('--accent-soft', C.theme.accentSoft);
  document.title = C.brand.name + '｜' + C.brand.tagline;

  const $ = id => document.getElementById(id);
  $('c-eyebrow').textContent = C.brand.eyebrow;
  $('c-name').innerHTML = C.brand.name + (C.brand.reading ? ' <small>' + C.brand.reading + '</small>' : '');
  $('c-tag').textContent = C.brand.tagline;
  $('c-heroline').textContent = C.brand.heroLine;

  $('home-cards').innerHTML = C.home.cards.map(cd =>
    '<div class="card" style="margin-bottom:12px"><span class="pill ' + (cd.tone||'plain') + '">' + cd.pill + '</span>' +
    '<p style="margin:8px 0 4px;font-weight:600;font-size:14.5px">' + cd.title + '</p>' +
    '<p style="margin:0' + (cd.cta ? ' 0 12px' : '') + ';font-size:12.5px;color:var(--muted)">' + cd.body + '</p>' +
    (cd.cta ? '<button class="btn accent wide" onclick="' + (cd.action==='line'?'goLine()':'goC(\'c-reserve\')') + '">' + cd.cta + '</button>' : '') +
    '</div>').join('');

  $('menu-body').innerHTML =
    C.menu.sections.map(sec =>
      '<h2 class="sec-h" style="margin-top:8px">' + sec.title + '</h2><div class="card">' +
      sec.items.map(m =>
        '<div class="menu-item"><span><b>' + m.name + '</b><span class="d">' + m.desc + '</span></span><span class="p num">' + m.price + '</span></div>'
      ).join('') + '</div>'
    ).join('') +
    (C.menu.highlight ? '<div class="card" style="margin-top:12px"><b style="font-size:14px">' + C.menu.highlight.title + '</b><p style="font-size:12.5px;color:var(--muted);margin:6px 0 0">' + C.menu.highlight.body + '</p></div>' : '') +
    '<p style="font-size:11.5px;color:var(--muted);margin:12px 2px">' + C.menu.note + '</p>';

  $('access-map-label').textContent = C.access.mapLabel;
  $('access-rows').innerHTML = C.access.rows.map(row =>
    '<div class="menu-item"><span><b>' + row[0] + '</b></span><span style="font-size:13px;text-align:right" class="num">' + row[1] + '</span></div>').join('');
  $('access-cancel').innerHTML = '<b style="font-size:14px">' + C.access.cancel.title + '</b><p style="font-size:12.5px;color:var(--muted);margin:6px 0 0">' + C.access.cancel.body + '</p>';

  $('reserve-intro').textContent = C.reserve.intro;
  $('reserve-line-note').textContent = C.reserve.lineNote;
  $('reserve-web-note').textContent = C.reserve.webNote;
  $('reserve-tel').textContent = C.contact.telDisplay;
  $('reserve-tel-note').textContent = C.contact.telNote;
  $('reserve-disclaimer').textContent = C.reserve.disclaimer;
}
if (!TENANT) hydrate();   /* テナント指定時は設定取得後に流し込む（スクリプト末尾） */

/* ============ 連絡先アクション ============ */
function goLine(){toast('LINEを開いています…');window.open(C.contact.lineUrl,'_blank');}
function goTel(){toast('発信します：'+C.contact.telDisplay);location.href='tel:'+C.contact.tel;}

/* ============ 画面切替 ============ */
function goC(id,keepHash){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  document.querySelectorAll('#c-tab button').forEach(b=>b.classList.toggle('on',b.dataset.s===id));
  document.getElementById('c-screens').scrollTo(0,0);
  window.scrollTo(0,0);
  if(id==='c-chat') initChat();
  if(id==='c-counsel'&&!counselStarted) resetCounsel();
  /* URLを画面に合わせる（共有・ブックマーク用。履歴は増やさない） */
  if(!keepHash){
    const h = Object.keys(HASH_MAP).find(k=>HASH_MAP[k]===id);
    /* ?s=（テナント指定）を消さないよう、検索部分は常に維持する */
    if(h) history.replaceState(null,'', h==='home' ? location.pathname+location.search : location.search+'#'+h);
  }
}
document.getElementById('c-tab').addEventListener('click',e=>{const b=e.target.closest('button');if(b)goC(b.dataset.s);});

/* ============ URLハッシュで直接開く ============
   外部サイト（ホームページ等）から特定画面へ誘導するため。
   例: .../salon-AI-OS/#counsel → AIカウンセラーが直接開く */
const HASH_MAP={home:'c-home',menu:'c-menu',counsel:'c-counsel',chat:'c-chat',access:'c-access',reserve:'c-reserve'};
function applyHash(){
  const id=HASH_MAP[location.hash.replace('#','').toLowerCase()];
  if(id) goC(id,true);
}
window.addEventListener('hashchange',applyHash);
/* 初回の適用は、チャット・カウンセラーの初期化後（スクリプト末尾）に行う */

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ============ AI受付チャット ============ */
let chatInited=false, chatHistory=[];
const aiMode=()=>!!(C.ai && C.ai.endpoint);
function initChat(){
  if(chatInited) return; chatInited=true;
  chatHistory=[];
  document.getElementById('chat-form').hidden=!aiMode();
  document.getElementById('chat-note').textContent=aiMode()
    ? 'AIがサロンの登録情報（ナレッジ）に基づいてお答えします。個人情報の入力はお控えください。'
    : 'AI受付はサロンの登録情報（ナレッジ）に基づいてお答えします。';
  aiSay(C.reception.greeting);
  renderChips();
}
function renderChips(){
  const c=document.getElementById('chat-chips');
  c.innerHTML='';
  Object.keys(C.reception.faq).forEach(k=>{
    const b=document.createElement('button');b.className='chip';b.textContent=k;
    b.onclick=()=>ask(k);c.appendChild(b);
  });
}
function addUserMsg(text){
  const log=document.getElementById('chat-log');
  const me=document.createElement('div');me.className='msg me';me.textContent=text;log.appendChild(me);
  const ty=document.createElement('div');ty.className='typing';ty.textContent='AI受付が入力中…';log.appendChild(ty);
  scrollChat();
  return ty;
}
function ask(k){
  /* 「予約したい」は常に予約導線（AI接続時も確実に誘導するため） */
  const a=C.reception.faq[k];
  if(aiMode() && typeof a==='string'){ sendToAI(k); return; }
  const ty=addUserMsg(k);
  setTimeout(()=>{
    ty.remove();
    if(typeof a==='string') aiSay(a);
    else aiSay(a.text, a.reserve);
  },700);
}
async function sendToAI(text){
  const ty=addUserMsg(text);
  chatHistory.push({role:'user',content:text});
  try{
    const res=await fetch(C.ai.endpoint,{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({dept:'reception',salon:TENANT||undefined,messages:chatHistory.slice(-12)})
    });
    if(!res.ok) throw new Error('http '+res.status);
    const data=await res.json();
    ty.remove();
    const reply=data.reply||'すみません、うまくお答えできませんでした。';
    chatHistory.push({role:'assistant',content:reply});
    aiSay(reply, data.reserve===true);
  }catch(e){
    ty.remove();
    chatHistory.pop();
    aiSay('申し訳ありません、ただいま接続が不安定です。お急ぎの場合は公式LINEまたはお電話（'+C.contact.telDisplay+'）でお問い合わせください。', true);
  }
}
document.getElementById('chat-form').addEventListener('submit',e=>{
  e.preventDefault();
  const inp=document.getElementById('chat-input');
  const text=inp.value.trim();
  if(!text) return;
  inp.value='';
  sendToAI(text);
});
function aiSay(text,withReserve){
  const log=document.getElementById('chat-log');
  const m=document.createElement('div');m.className='msg ai';m.textContent=text;
  if(withReserve){
    const cta=document.createElement('div');cta.className='cta';
    cta.innerHTML='<button class="btn accent" onclick="goLine()">LINEで予約する</button>'+
                  '<button class="btn ghost" onclick="goC(\'c-reserve\')">ほかの予約方法を見る</button>';
    m.appendChild(cta);
  }
  log.appendChild(m);scrollChat();
}
function scrollChat(){
  const sc=document.getElementById('c-screens');
  sc.scrollTo({top:sc.scrollHeight,behavior:'smooth'});
  window.scrollTo(0,document.body.scrollHeight);
}

/* ============ AIカウンセラー ============ */
let counselStarted=false, counselAns={};
function resetCounsel(){
  counselStarted=true;counselAns={};
  counselStep(1);
}
function counselStep(n){
  const body=document.getElementById('counsel-body');
  const CO=C.counselor;
  const dots=(k)=>'<div class="step-dots">'+[1,2,3].map(i=>'<i class="'+(i<=k?'on':'')+'"></i>').join('')+'</div>';
  if(n===1){
    body.innerHTML=dots(1)+'<p class="counsel-q">'+CO.q1+'</p><div class="opt-list">'+
      Object.keys(CO.concerns).map(k=>'<button onclick="counselPick(1,\''+k+'\')"><span class="ic">'+CO.concerns[k].ic+'</span>'+k+'</button>').join('')+'</div>';
  }else if(n===2){
    body.innerHTML=dots(2)+'<p class="counsel-q">'+CO.q2.q+'</p><div class="opt-list">'+
      CO.q2.opts.map(k=>'<button onclick="counselPick(2,\''+k+'\')"><span class="ic">🕰</span>'+k+'</button>').join('')+'</div>';
  }else if(n===3){
    body.innerHTML=dots(3)+'<p class="counsel-q">'+CO.q3.q+'</p><div class="opt-list">'+
      CO.q3.opts.map(k=>'<button onclick="counselPick(3,\''+k+'\')"><span class="ic">🧴</span>'+k+'</button>').join('')+'</div>';
  }else{
    const c=CO.concerns[counselAns[1]];
    body.innerHTML=
      '<div class="step-dots"><i class="on"></i><i class="on"></i><i class="on"></i></div>'+
      '<p class="counsel-q">'+counselAns[1]+'が気になる、'+counselAns[3]+'のあなたへ</p>'+
      '<div class="card result-block"><div class="lbl">RECOMMENDED CARE</div><b>'+c.care+'</b><p style="font-size:12.5px;color:var(--muted);margin:4px 0 0">「'+counselAns[2]+'」とのことなので、まずは1回体験し、肌の反応を見ながら通う間隔をご提案します。</p></div>'+
      '<div class="card result-block"><div class="lbl">HOME CARE</div><b>'+c.item+'</b><p style="font-size:12.5px;color:var(--muted);margin:4px 0 0">サロンでの取り扱いがあります。使い方はご来店時に丁寧にお伝えします。</p></div>'+
      '<div class="card result-block"><div class="lbl">LIFESTYLE</div><p style="font-size:13px;margin:0">'+c.life+'</p></div>'+
      '<div class="disclaimer">'+CO.disclaimer+'</div>'+
      '<button class="btn accent wide" style="margin-bottom:10px" onclick="goLine()">この結果をLINEで受け取る</button>'+
      '<button class="btn ghost wide" onclick="goC(\'c-reserve\')">このメニューで予約する</button>'+
      '<p style="font-size:11px;color:var(--muted);text-align:center;margin-top:12px"><button style="text-decoration:underline" onclick="resetCounsel()">最初からやり直す</button></p>';
  }
  document.getElementById('c-screens').scrollTo(0,0);window.scrollTo(0,0);
}
function counselPick(step,val){counselAns[step]=val;counselStep(step+1);}

/* ============ 設定エディタからのライブ更新 ============ */
window.addEventListener('message',e=>{
  const d=e.data;
  if(!d || d.type!=='salon-config' || !d.config) return;
  C=d.config;
  hydrate();
  chatInited=false;chatHistory=[];
  document.getElementById('chat-log').innerHTML='';
  document.getElementById('chat-chips').innerHTML='';
  counselStarted=false;
  document.getElementById('counsel-body').innerHTML='';
  const active=document.querySelector('.screen.active');
  if(active && active.id==='c-chat') initChat();
  if(active && active.id==='c-counsel') resetCounsel();
});

/* ============ テナント設定の取得（?s= 指定時のみ） ============ */
async function loadTenantConfig(){
  try{
    const base = (window.SALON_CONFIG.ai && window.SALON_CONFIG.ai.endpoint || '').replace(/\/$/,'');
    if(!base) throw new Error('no endpoint');
    const res = await fetch(base + '/config?s=' + encodeURIComponent(TENANT));
    if(!res.ok) throw new Error('http ' + res.status);
    C = await res.json();
    hydrate();
    applyHash();
  }catch(e){
    /* 未登録・停止中・通信不能。他サロン（同梱設定）を出すのは誤りなので専用画面に */
    showUnavailable();
  }
}
function showUnavailable(){
  document.body.innerHTML =
    '<div style="max-width:420px;margin:18vh auto 0;padding:0 28px;text-align:center;font-family:inherit">' +
    '<p style="font-size:40px;margin:0 0 14px">🌿</p>' +
    '<p style="font-weight:600;font-size:16px;margin:0 0 8px">このページは現在ご利用いただけません</p>' +
    '<p style="font-size:13px;color:#8B8378;line-height:1.9;margin:0 0 22px">アドレスをご確認のうえ、時間をおいてもう一度お試しください。</p>' +
    '<button onclick="location.reload()" style="padding:13px 30px;border:1px solid #E8E3DC;border-radius:999px;background:#fff;font-family:inherit;font-size:14px;cursor:pointer">再読み込み</button>' +
    '</div>';
}

/* ============ 起動 ============
   すべての定義が済んだ最後にハッシュを適用する */
if (TENANT) loadTenantConfig(); else applyHash();
</script>
