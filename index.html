<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salon AI OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Salon AI OS — Design System v1（Claude Design資料準拠）
     ・アクセント1色＋ゴールド（--hair）は線のみ
     ・角丸は3〜4px、チップ/入力のみpill
     ・カードに影を付けず罫線で区切る
     ・見出し明朝／本文ゴシック／ロゴ・数字は欧文セリフ
     サロン固有の3色（--accent / --accent-deep / --accent-soft）は
     従来どおり salon-config.js から注入され、残りは自動導出。
     ============================================================ */
  :root{
    --paper:#FFFFFF;         /* アプリ面 */
    --bg:#F3EEE7;            /* アプリ外の地 */
    --surface:#F4EFE8;       /* 淡い面（AI吹き出し・注記地） */
    --surface-2:#FCFAF6;     /* さらに淡い面（情報カード地） */
    --card:#FFFFFF;
    --line:#E7E0D6;
    --line-2:#F0EAE1;
    --ink:#2C2723;
    --ink-2:#5C544C;
    --muted:#8E857A;
    --accent:#8C6F58;        /* サロン設定で上書きされます */
    --accent-deep:#6E543F;
    --accent-soft:#F4EEE7;
    --hair:color-mix(in srgb, var(--accent) 45%, #FFFFFF);  /* 線・囲み用ゴールド */
    --sage:#8FA08A;
    --sage-soft:#EDF1EA;
    --gold:#C2A36B;
    --gold-soft:#F5EEDF;
    --rose:#C08A80;
    --rose-soft:#F6E9E6;
    --radius:4px;
    --serif:'Zen Old Mincho',"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --sans:'Zen Kaku Gothic New',"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",-apple-system,sans-serif;
    --latin:'Cormorant Garamond',"Hiragino Mincho ProN",serif;
    color-scheme: light; /* 白基調・くすみカラーの世界観に固定 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15.5px;
    line-height:1.95;
    -webkit-font-smoothing:antialiased;
    text-wrap:pretty;
  }
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ============ 共通部品 ============ */
  .eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:400}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    min-height:54px;padding:0 22px;border-radius:var(--radius);
    font-weight:500;font-size:15.5px;letter-spacing:.06em;
    background:var(--ink);color:#fff;transition:opacity .15s;
  }
  .btn:active{opacity:.78}
  .btn.accent{background:var(--accent-deep)}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.wide{width:100%}
  .chip{
    display:inline-flex;align-items:center;min-height:42px;padding:0 18px;border-radius:21px;
    font-size:14px;letter-spacing:.04em;
    background:var(--card);border:1px solid var(--line);color:var(--ink-2);
  }
  .chip:active{background:var(--accent-soft);border-color:var(--hair);color:var(--accent-deep)}
  .card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);padding:20px}
  .pill{
    display:inline-block;font-size:10.5px;font-weight:500;letter-spacing:.14em;
    padding:3px 10px;border-radius:3px;border:1px solid var(--line);color:var(--muted);background:transparent;
  }
  .pill.sage{border-color:var(--line);color:#6E8069;background:var(--sage-soft)}
  .pill.gold{border-color:var(--hair);color:var(--accent-deep);background:var(--accent-soft)}
  .pill.rose{border-color:var(--line);color:#96594E;background:var(--rose-soft)}
  .pill.plain{background:var(--surface-2);color:var(--muted)}
  .num{font-variant-numeric:tabular-nums}

  /* ============ アプリ枠 ============ */
  .wrap{min-height:100vh}
  @media(min-width:768px){
    .wrap{display:flex;align-items:flex-start;justify-content:center;padding:56px 20px}
    .phone{
      width:440px;height:calc(100vh - 112px);min-height:620px;
      border:1px solid var(--line);border-radius:6px;
      background:var(--paper);overflow:hidden;position:relative;
      box-shadow:0 44px 100px -64px rgba(70,52,36,.55);
    }
  }
  .phone{background:var(--paper);position:relative;min-height:100vh}
  @media(min-width:768px){.phone{min-height:0}}
  .screens{position:absolute;inset:0;overflow-y:auto;padding-bottom:104px}
  @media(max-width:767px){.screens{position:static;min-height:100vh}}
  .screen{display:none;padding:0 22px 28px;animation:fade .25s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .topbar{
    position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
    padding:18px 0 14px;background:var(--paper);border-bottom:1px solid var(--line-2);
    margin:0 0 6px;
  }
  .topbar .back{
    width:36px;height:36px;border-radius:18px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-2);background:var(--paper);
  }
  .topbar .t{font-family:var(--serif);font-weight:400;font-size:16.5px;letter-spacing:.06em}

  /* 下部タブ（線画アイコン・選択中はpill地＋太字） */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;z-index:10;
    display:flex;background:var(--paper);
    border-top:1px solid var(--line);padding:8px 6px calc(12px + env(safe-area-inset-bottom));
  }
  @media(max-width:767px){.tabbar{position:fixed}}
  .tabbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
    font-size:12px;letter-spacing:.06em;color:var(--muted);padding:4px 0;min-height:56px;justify-content:center;
  }
  .tabbar button .ic{
    display:flex;align-items:center;justify-content:center;
    width:46px;height:30px;border-radius:15px;font-size:0;line-height:1;
  }
  .tabbar button svg{display:block}
  .tabbar button.on{color:var(--accent-deep);font-weight:700}
  .tabbar button.on .ic{background:var(--accent-soft)}

  /* ============ ホーム ============ */
  .brandbar{
    display:flex;align-items:center;gap:13px;
    padding:18px 0 15px;border-bottom:1px solid var(--line-2);
    margin:0 -22px 0;padding-left:22px;padding-right:22px;background:var(--paper);
  }
  .brandbar .mark{
    flex:none;display:flex;align-items:center;justify-content:center;
    width:40px;height:40px;border-radius:20px;border:1px solid var(--hair);
    font-family:var(--latin);font-size:16px;letter-spacing:.04em;color:var(--accent-deep);
  }
  .brandbar h1{margin:0;font-family:var(--serif);font-weight:400;font-size:17.5px;letter-spacing:.06em;line-height:1.4}
  .brandbar h1 small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:400;margin-top:2px}
  .hero-visual{
    aspect-ratio:4/3;margin:0 -22px;position:relative;
    background:repeating-linear-gradient(135deg,var(--surface) 0 7px,var(--surface-2) 7px 14px);
    border-bottom:1px solid var(--line-2);
  }
  .hero-visual .in{
    position:absolute;left:22px;bottom:16px;z-index:1;
    font-family:var(--serif);font-size:14.5px;letter-spacing:.1em;color:var(--ink-2);
  }
  /* サロン写真（brand.heroImage）が設定されているとき */
  .hero-visual.has-img{background-size:cover;background-position:center}
  .hero-visual.has-img::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(30,24,20,.48),rgba(30,24,20,0) 50%);
  }
  .hero-visual.has-img .in{color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.25)}
  .tag{
    font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.85;letter-spacing:.03em;
    color:var(--ink);margin:30px 0 22px;text-wrap:balance;
  }
  .ai-banner{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    width:100%;min-height:64px;text-align:left;margin-bottom:12px;
    background:var(--accent-deep);border-radius:var(--radius);padding:14px 20px;
  }
  .ai-banner:active{opacity:.85}
  .ai-banner b{display:block;font-size:16.5px;font-weight:500;letter-spacing:.06em;color:#fff}
  .ai-banner .sub{display:block;font-size:11.5px;letter-spacing:.06em;color:rgba(255,255,255,.72);margin-top:3px}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
  .quick-grid .q{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:74px;justify-content:center;
  }
  .quick-grid .q:active{background:var(--accent-soft);border-color:var(--hair)}
  .quick-grid .q b{font-size:15px;font-weight:500;letter-spacing:.04em;display:block}
  .quick-grid .q span{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
  .sec-h{
    font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.2em;
    color:var(--muted);margin:34px 0 12px;
  }
  .powered{
    margin:40px 0 8px;padding-top:18px;border-top:1px solid var(--line-2);
    font-size:10.5px;letter-spacing:.18em;color:var(--muted);
  }

  /* ============ メニュー・一覧 ============ */
  .menu-item{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:18px 0;border-bottom:1px solid var(--line-2)}
  .menu-item:last-child{border-bottom:none}
  .menu-item b{font-family:var(--serif);font-size:16.5px;font-weight:400;letter-spacing:.04em;line-height:1.6;display:block}
  .menu-item .d{font-size:13px;color:var(--muted);line-height:1.85;display:block;margin-top:4px;font-family:var(--sans)}
  .menu-item .p{font-size:16px;font-weight:500;white-space:nowrap;letter-spacing:.02em}
  .menu-item .p small{color:var(--muted);font-weight:400}

  /* ============ チャット（コンシェルジュ） ============ */
  .chat-log{display:flex;flex-direction:column;gap:22px;padding:14px 0 12px;min-height:200px}
  .msg{animation:rise .4s ease both}
  .msg.ai{
    max-width:100%;align-self:stretch;
    font-size:15.5px;line-height:2.0;color:var(--ink-2);white-space:pre-line;
  }
  .msg.ai::before{
    content:"CONCIERGE";display:block;
    font-size:10px;letter-spacing:.22em;color:var(--muted);margin-bottom:9px;white-space:normal;
  }
  .msg.me{
    max-width:86%;align-self:flex-end;
    background:var(--surface);border-radius:var(--radius);padding:14px 17px;
    font-size:15.5px;line-height:1.9;color:var(--ink);white-space:pre-line;
  }
  .msg.ai .cta{margin-top:14px;display:flex;flex-direction:column;gap:10px;white-space:normal}
  .typing{align-self:flex-start;color:var(--muted);font-size:13px;letter-spacing:.1em;padding:4px 0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 14px}
  .chat-note{font-size:11.5px;line-height:1.85;color:var(--muted);text-align:center;padding:8px 0 0}
  #chat-form{display:flex;align-items:center;gap:10px;padding:2px 0 10px}
  #chat-form[hidden]{display:none}
  #chat-input{
    flex:1;min-width:0;min-height:54px;padding:0 18px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:27px;
    font-size:16px;letter-spacing:.02em;outline:none;
  }
  #chat-input:focus{border-color:var(--hair)}
  .send{
    flex:none;width:54px;height:54px;border-radius:27px;background:var(--accent-deep);
    display:flex;align-items:center;justify-content:center;
  }
  .send:active{opacity:.8}

  /* ============ カウンセラー ============ */
  .step-dots{display:flex;gap:6px;margin:14px 0 20px}
  .step-dots i{width:26px;height:2px;background:var(--line)}
  .step-dots i.on{background:var(--accent-deep)}
  .opt-list{display:flex;flex-direction:column;gap:10px}
  .opt-list button{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;text-align:left;font-size:15.5px;letter-spacing:.02em;
    display:flex;align-items:center;gap:14px;min-height:58px;line-height:1.8;
  }
  .opt-list button:active{border-color:var(--hair);background:var(--accent-soft)}
  .opt-list .ic{font-size:19px;flex:none}
  .counsel-q{font-family:var(--serif);font-size:21px;font-weight:400;letter-spacing:.04em;line-height:1.75;margin:6px 0 18px;text-wrap:balance}
  .result-block{margin-bottom:12px}
  .result-block .lbl{font-size:10.5px;letter-spacing:.2em;color:var(--accent-deep);font-weight:500;margin-bottom:7px}
  .result-block b{font-family:var(--serif);font-weight:400;font-size:16.5px;letter-spacing:.03em;line-height:1.7}
  .disclaimer{
    font-size:12.5px;line-height:1.9;color:var(--muted);
    background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--radius);
    padding:14px 16px;margin:18px 0;
  }

  /* ============ トースト ============ */
  #toast{
    position:fixed;left:50%;bottom:112px;transform:translateX(-50%) translateY(16px);
    background:var(--ink);color:#fff;font-size:13px;letter-spacing:.04em;
    padding:12px 22px;border-radius:var(--radius);
    opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap;max-width:92vw;
  }
  #toast.show{opacity:1;transform:translateX(-50%)}
</style>

<!-- ================= お客様ページ ================= -->
<div class="wrap">
  <div class="phone">
    <div class="screens" id="c-screens">

      <!-- ホーム -->
      <section class="screen active" id="c-home">
        <div class="brandbar">
          <span class="mark" id="c-mark"></span>
          <span><h1 id="c-name"></h1><span class="eyebrow" id="c-eyebrow"></span></span>
        </div>
        <div class="hero-visual"><span class="in" id="c-heroline"></span></div>
        <p class="tag" id="c-tag"></p>
        <button class="ai-banner" onclick="goC('c-counsel');resetCounsel()">
          <span><b>AIに相談する</b><span class="sub">3つの質問で、あなたに合うケアをご提案（無料・24時間）</span></span>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.3"><line x1="3" y1="9" x2="14" y2="9"/><line x1="10" y1="5" x2="14" y2="9"/><line x1="10" y1="13" x2="14" y2="9"/></svg>
        </button>
        <div class="quick-grid">
          <button class="q" onclick="goC('c-chat')"><b>AI受付に質問</b><span>営業時間・料金など</span></button>
          <button class="q" onclick="goC('c-reserve')"><b>予約する</b><span>LINE・Web・お電話</span></button>
          <button class="q" onclick="goC('c-menu')"><b>メニュー</b><span>料金のご案内</span></button>
          <button class="q" onclick="goC('c-access')"><b>アクセス</b><span>営業時間・場所</span></button>
        </div>
        <h2 class="sec-h">ただいまのご案内</h2>
        <div id="home-cards"></div>
        <p class="powered">POWERED BY SALON AI OS</p>
      </section>

      <!-- メニュー -->
      <section class="screen" id="c-menu">
        <div class="topbar"><button class="back" onclick="goC('c-home')">←</button><span class="t">メニュー・料金</span></div>
        <div id="menu-body"></div>
        <button class="btn wide" style="margin-top:8px" onclick="goC('c-reserve')">このメニューで予約に進む</button>
      </section>

      <!-- AI受付チャット -->
      <section class="screen" id="c-chat">
        <div class="topbar"><button class="back" onclick="goC('c-home')">←</button>
          <span class="t">AI受付</span><span class="pill sage">24時間対応</span></div>
        <div class="chat-log" id="chat-log"></div>
        <div class="chips" id="chat-chips"></div>
        <form id="chat-form" hidden>
          <input id="chat-input" placeholder="ご質問をどうぞ" autocomplete="off">
          <button class="send" type="submit" aria-label="送信">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.4"><line x1="10" y1="15" x2="10" y2="5"/><line x1="6" y1="9" x2="10" y2="5"/><line x1="14" y1="9" x2="10" y2="5"/></svg>
          </button>
        </form>
        <p class="chat-note" id="chat-note">AI受付はサロンの登録情報（ナレッジ）に基づいてお答えします。</p>
      </section>

      <!-- AIカウンセラー -->
      <section class="screen" id="c-counsel">
        <div class="topbar"><button class="back" onclick="goC('c-home')">←</button><span class="t">AI相談</span></div>
        <div id="counsel-body"></div>
      </section>

      <!-- アクセス -->
      <section class="screen" id="c-access">
        <div class="topbar"><button class="back" onclick="goC('c-home')">←</button><span class="t">アクセス・営業時間</span></div>
        <div class="hero-visual" style="aspect-ratio:auto;height:130px;margin:14px 0 14px;border:1px solid var(--line-2)"><span class="in" id="access-map-label" style="left:16px"></span></div>
        <div class="card" style="margin-bottom:12px" id="access-rows"></div>
        <div class="card" id="access-cancel"></div>
      </section>

      <!-- 予約導線 -->
      <section class="screen" id="c-reserve">
        <div class="topbar"><button class="back" onclick="goC('c-home')">←</button><span class="t">ご予約</span></div>
        <p style="font-size:14.5px;line-height:2;color:var(--ink-2);margin:10px 2px 18px" id="reserve-intro"></p>
        <div class="opt-list">
          <button onclick="goLine()"><span class="ic"><svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="var(--accent-deep)" stroke-width="1.3"><rect x="3" y="4" width="14" height="10" rx="2"/><line x1="7" y1="14" x2="6" y2="17"/></svg></span><span><b>LINEで予約する</b>　<span class="pill gold">おすすめ</span><br><span style="font-size:12.5px;color:var(--muted)" id="reserve-line-note"></span></span></button>
          <button onclick="toast('Web予約フォームは準備中です。LINEをご利用ください')"><span class="ic"><svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="var(--ink-2)" stroke-width="1.3"><rect x="3" y="5" width="14" height="12"/><line x1="3" y1="9" x2="17" y2="9"/><line x1="7" y1="3" x2="7" y2="5"/><line x1="13" y1="3" x2="13" y2="5"/></svg></span><span><b>Webフォームで予約する</b><br><span style="font-size:12.5px;color:var(--muted)" id="reserve-web-note"></span></span></button>
          <button onclick="goTel()"><span class="ic"><svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="var(--ink-2)" stroke-width="1.3"><path d="M4 3h4l2 5-2.5 1.5a11 11 0 0 0 3 3L12 10l5 2v4a1 1 0 0 1-1 1A13 13 0 0 1 3 4a1 1 0 0 1 1-1z"/></svg></span><span><b>電話で予約する</b>　<span class="num" style="font-size:13.5px" id="reserve-tel"></span><br><span style="font-size:12.5px;color:var(--muted)" id="reserve-tel-note"></span></span></button>
        </div>
        <div class="disclaimer" id="reserve-disclaimer"></div>
      </section>
    </div>

    <nav class="tabbar" id="c-tab">
      <button data-s="c-home" class="on"><span class="ic"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><polyline points="3,9 10,4 17,9"/><rect x="5" y="9" width="10" height="8"/></svg></span>ホーム</button>
      <button data-s="c-menu"><span class="ic"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><line x1="3" y1="6" x2="17" y2="6"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="14" x2="12" y2="14"/></svg></span>メニュー</button>
      <button data-s="c-counsel"><span class="ic"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="4" width="14" height="10" rx="2"/><line x1="7" y1="14" x2="6" y2="17"/></svg></span>AI相談</button>
      <button data-s="c-chat"><span class="ic"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="10" cy="6" r="2.6"/><rect x="3" y="12" width="14" height="5"/></svg></span>受付</button>
      <button data-s="c-reserve"><span class="ic"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="5" width="14" height="12"/><line x1="3" y1="9" x2="17" y2="9"/><line x1="7" y1="3" x2="7" y2="5"/><line x1="13" y1="3" x2="13" y2="5"/></svg></span>予約</button>
    </nav>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="salon-config.js"></script>
<script>
/* =========================================================
   Salon AI OS — お客様ページ（全サロン共通エンジン）
   サロン固有の情報はすべて salon-config.js（SALON_CONFIG）から
   読み込みます。このファイルにサロン名や価格を書かないこと。
   オーナー用の管理画面は admin.html（このページからは繋がない）。
   ========================================================= */
let C = window.SALON_CONFIG;

/* ---- マルチテナント：?s=サロンID ----
   指定があればWorkerからそのサロンの設定を取得して着せ替える。
   無指定なら従来どおり同梱の salon-config.js（chainonjoli）で動く */
const TENANT = ((new URLSearchParams(location.search)).get('s') || '').toLowerCase();

/* ============ 設定の流し込み ============ */
function hydrate(){
  const r = document.documentElement.style;
  r.setProperty('--accent', C.theme.accent);
  r.setProperty('--accent-deep', C.theme.accentDeep);
  r.setProperty('--accent-soft', C.theme.accentSoft);
  document.title = C.brand.name + '｜' + C.brand.tagline;

  const $ = id => document.getElementById(id);
  $('c-eyebrow').textContent = C.brand.eyebrow;
  $('c-mark').textContent = C.brand.mark || (C.brand.name || '').slice(0, 1);
  $('c-name').innerHTML = C.brand.name + (C.brand.reading ? ' <small>' + C.brand.reading + '</small>' : '');
  $('c-tag').textContent = C.brand.tagline;
  $('c-heroline').textContent = C.brand.heroLine;
  /* トップ写真：設定があれば表示、無ければ従来の模様のまま */
  const hv = document.querySelector('#c-home .hero-visual');
  if (C.brand.heroImage) {
    hv.classList.add('has-img');
    hv.style.backgroundImage = 'url("' + String(C.brand.heroImage).replace(/["\\]/g, '') + '")';
  } else {
    hv.classList.remove('has-img');
    hv.style.backgroundImage = '';
  }

  $('home-cards').innerHTML = C.home.cards.map(cd =>
    '<div class="card" style="margin-bottom:12px"><span class="pill ' + (cd.tone||'plain') + '">' + cd.pill + '</span>' +
    '<p style="margin:8px 0 4px;font-weight:600;font-size:14.5px">' + cd.title + '</p>' +
    '<p style="margin:0' + (cd.cta ? ' 0 12px' : '') + ';font-size:12.5px;color:var(--muted)">' + cd.body + '</p>' +
    (cd.cta ? '<button class="btn accent wide" onclick="' + (cd.action==='line'?'goLine()':'goC(\'c-reserve\')') + '">' + cd.cta + '</button>' : '') +
    '</div>').join('');

  $('menu-body').innerHTML =
    C.menu.sections.map(sec =>
      '<h2 class="sec-h" style="margin-top:8px">' + sec.title + '</h2><div class="card">' +
      sec.items.map(m =>
        '<div class="menu-item"><span><b>' + m.name + '</b><span class="d">' + m.desc + '</span></span><span class="p num">' + m.price + '</span></div>'
      ).join('') + '</div>'
    ).join('') +
    (C.menu.highlight ? '<div class="card" style="margin-top:12px"><b style="font-size:14px">' + C.menu.highlight.title + '</b><p style="font-size:12.5px;color:var(--muted);margin:6px 0 0">' + C.menu.highlight.body + '</p></div>' : '') +
    '<p style="font-size:11.5px;color:var(--muted);margin:12px 2px">' + C.menu.note + '</p>';

  $('access-map-label').textContent = C.access.mapLabel;
  $('access-rows').innerHTML = C.access.rows.map(row =>
    '<div class="menu-item"><span><b>' + row[0] + '</b></span><span style="font-size:13px;text-align:right" class="num">' + row[1] + '</span></div>').join('');
  $('access-cancel').innerHTML = '<b style="font-size:14px">' + C.access.cancel.title + '</b><p style="font-size:12.5px;color:var(--muted);margin:6px 0 0">' + C.access.cancel.body + '</p>';

  $('reserve-intro').textContent = C.reserve.intro;
  $('reserve-line-note').textContent = C.reserve.lineNote;
  $('reserve-web-note').textContent = C.reserve.webNote;
  $('reserve-tel').textContent = C.contact.telDisplay;
  $('reserve-tel-note').textContent = C.contact.telNote;
  $('reserve-disclaimer').textContent = C.reserve.disclaimer;
}
if (!TENANT) hydrate();   /* テナント指定時は設定取得後に流し込む（スクリプト末尾） */

/* ============ 連絡先アクション ============ */
function goLine(){toast('LINEを開いています…');window.open(C.contact.lineUrl,'_blank');}
function goTel(){toast('発信します：'+C.contact.telDisplay);location.href='tel:'+C.contact.tel;}

/* ============ 画面切替 ============ */
function goC(id,keepHash){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  document.querySelectorAll('#c-tab button').forEach(b=>b.classList.toggle('on',b.dataset.s===id));
  document.getElementById('c-screens').scrollTo(0,0);
  window.scrollTo(0,0);
  if(id==='c-chat') initChat();
  if(id==='c-counsel'&&!counselStarted) resetCounsel();
  /* URLを画面に合わせる（共有・ブックマーク用。履歴は増やさない） */
  if(!keepHash){
    const h = Object.keys(HASH_MAP).find(k=>HASH_MAP[k]===id);
    /* ?s=（テナント指定）を消さないよう、検索部分は常に維持する */
    if(h) history.replaceState(null,'', h==='home' ? location.pathname+location.search : location.search+'#'+h);
  }
}
document.getElementById('c-tab').addEventListener('click',e=>{const b=e.target.closest('button');if(b)goC(b.dataset.s);});

/* ============ URLハッシュで直接開く ============
   外部サイト（ホームページ等）から特定画面へ誘導するため。
   例: .../salon-AI-OS/#counsel → AIカウンセラーが直接開く */
const HASH_MAP={home:'c-home',menu:'c-menu',counsel:'c-counsel',chat:'c-chat',access:'c-access',reserve:'c-reserve'};
function applyHash(){
  const id=HASH_MAP[location.hash.replace('#','').toLowerCase()];
  if(id) goC(id,true);
}
window.addEventListener('hashchange',applyHash);
/* 初回の適用は、チャット・カウンセラーの初期化後（スクリプト末尾）に行う */

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ============ AI受付チャット ============ */
let chatInited=false, chatHistory=[];
const aiMode=()=>!!(C.ai && C.ai.endpoint);
function initChat(){
  if(chatInited) return; chatInited=true;
  chatHistory=[];
  document.getElementById('chat-form').hidden=!aiMode();
  document.getElementById('chat-note').textContent=aiMode()
    ? 'AIがサロンの登録情報（ナレッジ）に基づいてお答えします。個人情報の入力はお控えください。'
    : 'AI受付はサロンの登録情報（ナレッジ）に基づいてお答えします。';
  aiSay(C.reception.greeting);
  renderChips();
}
function renderChips(){
  const c=document.getElementById('chat-chips');
  c.innerHTML='';
  Object.keys(C.reception.faq).forEach(k=>{
    const b=document.createElement('button');b.className='chip';b.textContent=k;
    b.onclick=()=>ask(k);c.appendChild(b);
  });
}
function addUserMsg(text){
  const log=document.getElementById('chat-log');
  const me=document.createElement('div');me.className='msg me';me.textContent=text;log.appendChild(me);
  const ty=document.createElement('div');ty.className='typing';ty.textContent='AI受付が入力中…';log.appendChild(ty);
  scrollChat();
  return ty;
}
function ask(k){
  /* 「予約したい」は常に予約導線（AI接続時も確実に誘導するため） */
  const a=C.reception.faq[k];
  if(aiMode() && typeof a==='string'){ sendToAI(k); return; }
  const ty=addUserMsg(k);
  setTimeout(()=>{
    ty.remove();
    if(typeof a==='string') aiSay(a);
    else aiSay(a.text, a.reserve);
  },700);
}
async function sendToAI(text){
  const ty=addUserMsg(text);
  chatHistory.push({role:'user',content:text});
  try{
    const res=await fetch(C.ai.endpoint,{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({dept:'reception',salon:TENANT||undefined,messages:chatHistory.slice(-12)})
    });
    if(!res.ok) throw new Error('http '+res.status);
    const data=await res.json();
    ty.remove();
    const reply=data.reply||'すみません、うまくお答えできませんでした。';
    chatHistory.push({role:'assistant',content:reply});
    aiSay(reply, data.reserve===true);
  }catch(e){
    ty.remove();
    chatHistory.pop();
    aiSay('申し訳ありません、ただいま接続が不安定です。お急ぎの場合は公式LINEまたはお電話（'+C.contact.telDisplay+'）でお問い合わせください。', true);
  }
}
document.getElementById('chat-form').addEventListener('submit',e=>{
  e.preventDefault();
  const inp=document.getElementById('chat-input');
  const text=inp.value.trim();
  if(!text) return;
  inp.value='';
  sendToAI(text);
});
function aiSay(text,withReserve){
  const log=document.getElementById('chat-log');
  const m=document.createElement('div');m.className='msg ai';m.textContent=text;
  if(withReserve){
    const cta=document.createElement('div');cta.className='cta';
    cta.innerHTML='<button class="btn accent" onclick="goLine()">LINEで予約する</button>'+
                  '<button class="btn ghost" onclick="goC(\'c-reserve\')">ほかの予約方法を見る</button>';
    m.appendChild(cta);
  }
  log.appendChild(m);scrollChat();
}
function scrollChat(){
  const sc=document.getElementById('c-screens');
  sc.scrollTo({top:sc.scrollHeight,behavior:'smooth'});
  window.scrollTo(0,document.body.scrollHeight);
}

/* ============ AIカウンセラー ============ */
let counselStarted=false, counselAns={};
function resetCounsel(){
  counselStarted=true;counselAns={};
  counselStep(1);
}
function counselStep(n){
  const body=document.getElementById('counsel-body');
  const CO=C.counselor;
  const dots=(k)=>'<div class="step-dots">'+[1,2,3].map(i=>'<i class="'+(i<=k?'on':'')+'"></i>').join('')+'</div>';
  if(n===1){
    body.innerHTML=dots(1)+'<p class="counsel-q">'+CO.q1+'</p><div class="opt-list">'+
      Object.keys(CO.concerns).map(k=>'<button onclick="counselPick(1,\''+k+'\')"><span class="ic">'+CO.concerns[k].ic+'</span>'+k+'</button>').join('')+'</div>';
  }else if(n===2){
    body.innerHTML=dots(2)+'<p class="counsel-q">'+CO.q2.q+'</p><div class="opt-list">'+
      CO.q2.opts.map(k=>'<button onclick="counselPick(2,\''+k+'\')"><span class="ic">🕰</span>'+k+'</button>').join('')+'</div>';
  }else if(n===3){
    body.innerHTML=dots(3)+'<p class="counsel-q">'+CO.q3.q+'</p><div class="opt-list">'+
      CO.q3.opts.map(k=>'<button onclick="counselPick(3,\''+k+'\')"><span class="ic">🧴</span>'+k+'</button>').join('')+'</div>';
  }else{
    const c=CO.concerns[counselAns[1]];
    body.innerHTML=
      '<div class="step-dots"><i class="on"></i><i class="on"></i><i class="on"></i></div>'+
      '<p class="counsel-q">'+counselAns[1]+'が気になる、'+counselAns[3]+'のあなたへ</p>'+
      '<div class="card result-block"><div class="lbl">RECOMMENDED CARE</div><b>'+c.care+'</b><p style="font-size:12.5px;color:var(--muted);margin:4px 0 0">「'+counselAns[2]+'」とのことなので、まずは1回体験し、肌の反応を見ながら通う間隔をご提案します。</p></div>'+
      '<div class="card result-block"><div class="lbl">HOME CARE</div><b>'+c.item+'</b><p style="font-size:12.5px;color:var(--muted);margin:4px 0 0">サロンでの取り扱いがあります。使い方はご来店時に丁寧にお伝えします。</p></div>'+
      '<div class="card result-block"><div class="lbl">LIFESTYLE</div><p style="font-size:13px;margin:0">'+c.life+'</p></div>'+
      '<div class="disclaimer">'+CO.disclaimer+'</div>'+
      '<button class="btn accent wide" style="margin-bottom:10px" onclick="goLine()">この結果をLINEで受け取る</button>'+
      '<button class="btn ghost wide" onclick="goC(\'c-reserve\')">このメニューで予約する</button>'+
      '<p style="font-size:11px;color:var(--muted);text-align:center;margin-top:12px"><button style="text-decoration:underline" onclick="resetCounsel()">最初からやり直す</button></p>';
  }
  document.getElementById('c-screens').scrollTo(0,0);window.scrollTo(0,0);
}
function counselPick(step,val){counselAns[step]=val;counselStep(step+1);}

/* ============ 設定エディタからのライブ更新 ============ */
window.addEventListener('message',e=>{
  const d=e.data;
  if(!d || d.type!=='salon-config' || !d.config) return;
  C=d.config;
  hydrate();
  chatInited=false;chatHistory=[];
  document.getElementById('chat-log').innerHTML='';
  document.getElementById('chat-chips').innerHTML='';
  counselStarted=false;
  document.getElementById('counsel-body').innerHTML='';
  const active=document.querySelector('.screen.active');
  if(active && active.id==='c-chat') initChat();
  if(active && active.id==='c-counsel') resetCounsel();
});

/* ============ テナント設定の取得（?s= 指定時のみ） ============ */
async function loadTenantConfig(){
  try{
    const base = (window.SALON_CONFIG.ai && window.SALON_CONFIG.ai.endpoint || '').replace(/\/$/,'');
    if(!base) throw new Error('no endpoint');
    const res = await fetch(base + '/config?s=' + encodeURIComponent(TENANT));
    if(!res.ok) throw new Error('http ' + res.status);
    C = await res.json();
    hydrate();
    applyHash();
  }catch(e){
    /* 未登録・停止中・通信不能。他サロン（同梱設定）を出すのは誤りなので専用画面に */
    showUnavailable();
  }
}
function showUnavailable(){
  document.body.innerHTML =
    '<div style="max-width:420px;margin:18vh auto 0;padding:0 28px;text-align:center;font-family:inherit">' +
    '<p style="font-size:40px;margin:0 0 14px">🌿</p>' +
    '<p style="font-weight:600;font-size:16px;margin:0 0 8px">このページは現在ご利用いただけません</p>' +
    '<p style="font-size:13px;color:#8B8378;line-height:1.9;margin:0 0 22px">アドレスをご確認のうえ、時間をおいてもう一度お試しください。</p>' +
    '<button onclick="location.reload()" style="padding:13px 30px;border:1px solid #E8E3DC;border-radius:999px;background:#fff;font-family:inherit;font-size:14px;cursor:pointer">再読み込み</button>' +
    '</div>';
}

/* ============ 起動 ============
   すべての定義が済んだ最後にハッシュを適用する */
if (TENANT) loadTenantConfig(); else applyHash();
</script>
